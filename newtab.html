<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小飞猪的希冀</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="background-layer" class="bg-gradient-1"></div>

    <div class="container">
        <div id="search-overlay" class="hidden"></div>
        <div id="search-container">
            <div id="ambient-time-container" class="ambient-time"></div>
            
            <div class="pure-greeting-group">
                <div class="ambient-time-greeting"></div>
                <div class="pure-time-display"></div>
            </div>

            <div class="search-wrapper">
                <div class="search-top-row">
                    <div id="engine-picker-container">
                        <button id="search-engine-label" type="button" aria-haspopup="listbox" aria-expanded="false">
                            Google
                        </button>
                        <div id="engine-picker-overlay" class="hidden"></div>
                        <div id="engine-wheel" class="hidden" role="listbox" aria-label="搜索引擎">
                            <button type="button" class="wheel-option" role="option" data-engine="google"
                                data-url="https://www.google.com/search?q=">
                                Google
                            </button>
                            <button type="button" class="wheel-option" role="option" data-engine="bing"
                                data-url="https://www.bing.com/search?q=">
                                Bing
                            </button>
                            <button type="button" class="wheel-option" role="option" data-engine="baidu"
                                data-url="https://www.baidu.com/s?wd=">
                                Baidu
                            </button>
                        </div>
                    </div>

                    <div class="pure-search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </div>

                    <input type="text" id="search-input" placeholder="寻找、发现，或者只是在此沉思..." autocomplete="off"
                        aria-label="搜索书签或搜索全网" aria-autocomplete="list" aria-controls="search-suggestions"
                        aria-expanded="false">

                    <button id="ai-sidebar-btn" title="打开 AI 面板" aria-label="打开 AI 面板">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ai-sparkle-icon">
                            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
                        </svg>
                    </button>
                </div>

                <div class="search-bottom-row">
                    <span class="pure-engine-label">搜索引擎</span>
                    <div class="pure-engine-list"></div>
                </div>
            </div>

            <div class="pure-footer-hint">按 ↩ 搜索 · Tab 切换引擎</div>
            <div id="search-suggestions" class="hidden" aria-live="polite" role="listbox" aria-label="搜索建议"></div>
        </div>

        <div id="bookmarks-tree" class="tree-view" aria-live="polite">
            <div class="tree-state tree-state-loading" role="status" aria-live="polite">
                <div class="tree-state-copy">
                    <strong>正在准备你的书签空间</strong>
                    <span>稍候片刻，常用目录和搜索索引正在加载。</span>
                </div>
                <div class="tree-state-skeleton" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <button id="pure-mode-btn" title="打开纯净模式" aria-label="打开纯净模式" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.4 13.2 7a1.8 1.8 0 0 0 1.14 1.14L18 9.3l-3.66 1.16a1.8 1.8 0 0 0-1.14 1.14L12 15.2l-1.2-3.6a1.8 1.8 0 0 0-1.14-1.14L6 9.3l3.66-1.16A1.8 1.8 0 0 0 10.8 7Z"></path>
                <path d="M18.2 15.2v5"></path>
                <path d="M15.7 17.7h5"></path>
            </svg>
        </button>

        <button id="layout-toggle-btn" title="切换布局模式" aria-label="切换布局模式">
            <svg id="layout-icon-tree" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <svg id="layout-icon-flat" class="icon-hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        </button>

        <button id="settings-btn" title="设置" aria-label="打开设置">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>

        <!-- Full Settings Modal Restored -->
        <div id="settings-modal" class="modal hidden">
            <div class="settings-content">
                <div class="settings-header">
                    <div class="settings-title-row">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                        <span class="settings-title">设置</span>
                    </div>
                    <button id="close-modal" class="close" type="button" aria-label="关闭设置面板"></button>
                </div>

                <div class="settings-body">
                    <div class="setting-item">
                        <label>链接打开方式</label>
                        <div class="settings-options">
                            <label class="radio-label">
                                <input type="radio" name="link-target" value="blank">
                                <span>新标签页</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="link-target" value="self">
                                <span>当前页</span>
                            </label>
                        </div>
                    </div>

                    <div class="setting-item">
                        <label>色彩主题</label>
                        <div class="settings-options">
                            <label class="radio-label">
                                <input type="radio" name="theme" value="light">
                                <span>浅色</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="theme" value="dark">
                                <span>深色</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="theme" value="system">
                                <span>跟随系统</span>
                            </label>
                        </div>
                    </div>

                    <div class="setting-item">
                        <label>默认布局模式</label>
                        <div class="settings-options">
                            <label class="radio-label">
                                <input type="radio" name="layout-mode" value="tree">
                                <span>树状</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="layout-mode" value="flat">
                                <span>平铺</span>
                            </label>
                        </div>
                    </div>

                    <div class="setting-item">
                        <label>背景设置</label>
                        <div class="settings-stack">
                            <div class="settings-row">
                                <button id="clear-bg" class="confirm-btn confirm-btn-cancel">清除背景</button>
                                <label for="bg-image-upload" class="confirm-btn confirm-btn-primary">
                                    上传图片
                                    <input type="file" id="bg-image-upload" accept="image/*" hidden>
                                </label>
                            </div>
                            <div id="blur-controls" class="settings-stack">
                                <div class="settings-range-header">
                                    <label class="settings-inline-label" for="bg-blur">背景模糊程度</label>
                                    <span id="bg-blur-value" class="settings-range-value">关闭</span>
                                </div>
                                <input type="range" id="bg-blur" min="0" max="10" step="1" value="0">

                                <div class="settings-range-header settings-range-header-spaced">
                                    <label class="settings-inline-label" for="container-blur">主容器透明度程度</label>
                                    <span id="container-blur-value" class="settings-range-value">0%</span>
                                </div>
                                <input type="range" id="container-blur" min="0" max="10" step="1" value="3">
                            </div>
                        </div>
                    </div>

                    <div class="setting-item">
                        <label>文件夹展开延迟</label>
                        <div class="settings-stack">
                            <div class="settings-range-header">
                                <span class="settings-inline-label">鼠标悬浮后延迟展开时间</span>
                                <span id="hover-delay-value" class="settings-range-value">300ms</span>
                            </div>
                            <input type="range" id="hover-delay" min="0" max="1100" step="100" value="300">
                        </div>
                    </div>

                    <div class="setting-item setting-item-ai">
                        <label>AI 服务管理</label>
                        <div class="ai-settings-shell">
                            <div class="ai-settings-intro">
                                <div class="ai-settings-heading">
                                    <div class="ai-settings-title-row">
                                        <span class="ai-settings-title">AI 服务列表</span>
                                    </div>
                                </div>
                                <div class="ai-settings-summary">
                                    <div class="ai-settings-summary-item">
                                        <span class="ai-settings-summary-value" id="ai-provider-count">0</span>
                                        <span class="ai-settings-summary-label">服务总数</span>
                                    </div>
                                    <div class="ai-settings-summary-item">
                                        <span class="ai-settings-summary-value" id="ai-provider-enabled-count">0</span>
                                        <span class="ai-settings-summary-label">启用中</span>
                                    </div>
                                </div>
                            </div>
                            <div id="ai-provider-list" class="ai-provider-list"></div>
                            <div class="ai-provider-composer">
                                <div class="ai-provider-form">
                                    <input type="text" id="ai-provider-name" placeholder="名称" maxlength="24">
                                    <input type="url" id="ai-provider-url" placeholder="网址 https://...">
                                    <button id="ai-provider-add" type="button" class="confirm-btn confirm-btn-primary">添加</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-toast" class="settings-toast"></div>

    <div id="folder-modal" class="modal hidden">
        <div class="folder-modal-content">
            <div class="folder-modal-header">
                <span class="folder-modal-icon"></span>
                <span class="folder-modal-title"></span>
                <button id="close-folder-modal" class="close" type="button"></button>
            </div>
            <div class="folder-modal-body"></div>
        </div>
    </div>

    <div id="confirm-dialog" class="modal hidden">
        <div class="confirm-dialog-content">
            <div class="confirm-dialog-title">确认</div>
            <div class="confirm-dialog-message" id="confirm-dialog-message"></div>
            <div class="confirm-dialog-actions">
                <button id="confirm-dialog-cancel" class="confirm-btn confirm-btn-cancel">取消</button>
                <button id="confirm-dialog-ok" class="confirm-btn confirm-btn-danger">确定</button>
            </div>
        </div>
    </div>

    <div id="ai-sidebar" class="ai-sidebar hidden">
        <div class="ai-sidebar-header">
            <div class="ai-sidebar-title">AI 助理</div>
            <button id="close-ai-sidebar" class="icon-btn">×</button>
        </div>
        <div id="ai-sidebar-frame-container" class="ai-sidebar-content">
            <iframe id="ai-sidebar-iframe" src="" frameborder="0"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
