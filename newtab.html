<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="background-layer"></div>

    <div class="container">
        <div id="search-container">
            <div class="search-wrapper">
                <div id="engine-picker-container">
                    <span id="search-engine-label">Google</span>
                    <div id="engine-picker-overlay" class="hidden"></div>
                    <div id="engine-wheel" class="hidden">
                        <div class="wheel-option" data-engine="google" data-url="https://www.google.com/search?q=">
                            Google</div>
                        <div class="wheel-option" data-engine="bing" data-url="https://www.bing.com/search?q=">Bing
                        </div>
                        <div class="wheel-option" data-engine="baidu" data-url="https://www.baidu.com/s?wd=">Baidu</div>
                    </div>
                </div>
                <input type="text" id="search-input" placeholder="Search bookmarks...">
            </div>
        </div>
        <div id="bookmarks-tree" class="tree-view"></div>
    </div>

    <button id="settings-btn" title="设置">⚙️</button>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close"></span>
            <h2>设置</h2>
            <div class="setting-item">
                <label for="bg-url">背景图片链接:</label>
                <input type="text" id="bg-url" placeholder="https://example.com/image.jpg">
            </div>
            <div class="setting-item">
                <label for="bg-upload">上传图片:</label>
                <div class="file-upload-container">
                    <input type="file" id="bg-upload" accept="image/*">
                    <button id="clear-bg">重置</button>
                    <span id="file-name-display"
                        style="font-size: 12px; color: var(--text-secondary); width: 100%;"></span>
                </div>
            </div>
            <div class="setting-item">
                <label for="bg-opacity">遮罩透明度:</label>
                <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.3">
            </div>
            <div class="setting-item">
                <label>链接打开方式</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="link-target" value="self"><span>当前页</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="link-target" value="blank" checked><span>新标签页</span>
                    </label>
                </div>
            </div>

            <div class="setting-item">
                <label>外观</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="theme" value="light"><span>浅色</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="theme" value="dark"><span>深色</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="theme" value="system"><span>跟随系统</span>
                    </label>
                </div>
            </div>

            <div class="setting-item">
                <label>图标风格</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="icon-style" value="native" checked><span>原生</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="icon-style" value="animals"><span>动物</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="icon-style" value="work"><span>办公</span>
                    </label>
                </div>
            </div>

            <div class="setting-item"
                style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 20px; padding-top: 20px;">
                <button id="about-btn" class="secondary-btn" style="width: 100%;">关于</button>
            </div>
        </div>
    </div>

    <!-- About Modal -->
    <div id="about-modal" class="modal hidden">
        <div class="modal-content" style="text-align: center;">
            <span id="close-about" class="close"></span>
            <div class="about-header">
                <h3>小飞猪的书签</h3>
                <p id="app-desc" class="description">A beautiful tree view of your bookmarks.</p>
                <p class="version">Version <span id="app-version">0.3.1</span></p>
            </div>
            <ul class="feature-list">
                <li><b>悬停交互：</b>灵动的悬停放大效果，文本左对齐更舒适。</li>
                <li><b>图标风格：</b>新增“办公”风格 Emoji，可在设置中自由切换。</li>
                <li><b>智能目录：</b>优化目录折叠逻辑，防止误触，浏览更顺畅。</li>
                <li><b>背景设置：</b>支持上传图片或链接，打造专属标签页。</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
