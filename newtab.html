<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="background-layer" class="bg-gradient-1"></div>

    <div class="container">
        <div id="search-container">
            <div id="search-overlay" class="hidden"></div>
            <div class="search-wrapper">
                <div id="engine-picker-container">
                    <span id="search-engine-label">Google</span>
                    <div id="engine-picker-overlay" class="hidden"></div>
                    <div id="engine-wheel" class="hidden">
                        <div class="wheel-option" data-engine="google" data-url="https://www.google.com/search?q=">
                            Google</div>
                        <div class="wheel-option" data-engine="bing" data-url="https://www.bing.com/search?q=">Bing
                        </div>
                        <div class="wheel-option" data-engine="baidu" data-url="https://www.baidu.com/s?wd=">Baidu</div>
                    </div>
                </div>
                <input type="text" id="search-input" placeholder="Search bookmarks..." autocomplete="off">
                <button id="ai-sidebar-btn" title="Google AI">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
                    </svg>
                </button>
                <div id="search-suggestions" class="hidden"></div>
            </div>
        </div>
        <div id="bookmarks-tree" class="tree-view"></div>
    </div>

    <!-- Google AI Sidebar -->
    <div id="ai-sidebar" class="ai-sidebar hidden">
        <div class="ai-sidebar-header">
            <span class="ai-sidebar-title">✨ Google AI</span>
            <div class="ai-sidebar-actions">
                <button id="ai-open-new-window" class="ai-action-btn" title="在新窗口打开">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path
                            d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z" />
                    </svg>
                </button>
                <button id="ai-sidebar-close" class="ai-action-btn" title="关闭">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </div>
        </div>
        <div class="ai-sidebar-content">
            <iframe id="ai-iframe" frameborder="0"></iframe>
            <div id="ai-iframe-fallback" class="ai-sidebar-placeholder hidden">
                <div class="ai-placeholder-icon">🔍</div>
                <p>无法直接嵌入 Google AI 搜索</p>
                <p class="ai-placeholder-hint">安全策略阻止了嵌入</p>
                <button id="ai-open-gemini" class="ai-open-btn">在弹窗中打开</button>
            </div>
        </div>
    </div>
    <div id="ai-sidebar-overlay" class="ai-sidebar-overlay hidden"></div>

    <button id="settings-btn" title="设置">⚙️</button>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close"></span>
            <h2>设置</h2>
            <div class="setting-item">
                <label>背景预设</label>
                <div class="bg-presets">
                    <div class="bg-preset-option bg-gradient-1" data-bg="bg-gradient-1" title="Gradient 1"></div>
                    <div class="bg-preset-option bg-gradient-2" data-bg="bg-gradient-2" title="Gradient 2"></div>
                    <div class="bg-preset-option bg-gradient-3" data-bg="bg-gradient-3" title="Gradient 3"></div>
                    <div class="bg-preset-option bg-gradient-4" data-bg="bg-gradient-4" title="Gradient 4"></div>
                    <div class="bg-preset-option bg-gradient-dark-1" data-bg="bg-gradient-dark-1"
                        title="Dark Gradient 1"></div>
                    <div class="bg-preset-option bg-gradient-dark-2" data-bg="bg-gradient-dark-2"
                        title="Dark Gradient 2"></div>
                </div>
            </div>
            <div class="setting-item">
                <label for="bg-url">自定义图片链接:</label>
                <input type="text" id="bg-url" placeholder="https://example.com/image.jpg">
            </div>
            <div class="setting-item">
                <label for="bg-upload">上传图片:</label>

                <div class="file-upload-container">
                    <input type="file" id="bg-upload" accept="image/*">
                    <button id="clear-bg">重置</button>
                    <span id="file-name-display"
                        style="font-size: 12px; color: var(--text-secondary); width: 100%;"></span>
                </div>
            </div>
            <div class="setting-item">
                <label for="bg-opacity">遮罩透明度:</label>
                <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.3">
            </div>
            <div class="setting-item">
                <label>链接打开方式</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="link-target" value="self"><span>当前页</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="link-target" value="blank" checked><span>新标签页</span>
                    </label>
                </div>
            </div>

            <div class="setting-item">
                <label>外观</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="theme" value="light"><span>浅色</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="theme" value="dark"><span>深色</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="theme" value="system"><span>跟随系统</span>
                    </label>
                </div>
            </div>

            <div class="setting-item">
                <label>图标风格</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="icon-style" value="native" checked><span>原生</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="icon-style" value="animals"><span>动物</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="icon-style" value="work"><span>办公</span>
                    </label>
                </div>
            </div>

            <div class="setting-item"
                style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 20px; padding-top: 20px;">
                <button id="about-btn" class="secondary-btn" style="width: 100%;">关于</button>
            </div>
        </div>
    </div>

    <!-- About Modal -->
    <div id="about-modal" class="modal hidden">
        <div class="modal-content" style="text-align: center;">
            <span id="close-about" class="close"></span>
            <div class="about-header">
                <h3>小飞猪的书签</h3>
                <p id="app-desc" class="description">A beautiful tree view of your bookmarks.</p>
                <p class="version">Version <span id="app-version">1.0.0</span></p>
            </div>
            <ul class="feature-list">
                <li><b>视觉升级：</b>全新简约书签树图标，适配现代 Deep/Midnight 主题背景。</li>
                <li><b>背景定制：</b>新增多款现代化渐变背景预设，支持一键切换。</li>
                <li><b>交互优化：</b>Mac 风格悬停展开，拖拽排序更丝滑。</li>
                <li><b>个性定制：</b>支持自定义背景图片、透明度及图标样式（原生/Emoji）。</li>
            </ul>
        </div>
    </div>

    <!-- Folder Expand Modal -->
    <div id="folder-modal" class="modal hidden">
        <div class="folder-modal-content">
            <div class="folder-modal-header">
                <span class="folder-modal-icon">📁</span>
                <span class="folder-modal-title"></span>
                <span id="close-folder-modal" class="close"></span>
            </div>
            <div class="folder-modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
