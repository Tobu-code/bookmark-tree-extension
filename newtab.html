<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="background-layer"></div>

    <div class="container">
        <div id="search-container">
            <div class="search-wrapper">
                <select id="search-engine-select">
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                </select>
                <input type="text" id="search-input" placeholder="Search bookmarks...">
            </div>
        </div>
        <div id="bookmarks-tree" class="tree-view"></div>
    </div>

    <button id="settings-btn" title="设置">⚙️</button>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close"></span>
            <h2>设置</h2>
            <div class="setting-item">
                <label for="bg-url">背景图片链接:</label>
                <input type="text" id="bg-url" placeholder="https://example.com/image.jpg">
            </div>
            <div class="setting-item">
                <label for="bg-upload">或上传图片:</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="file" id="bg-upload" accept="image/*">
                    <button id="clear-bg">重置</button>
                </div>
            </div>
            <div class="setting-item">
                <label for="bg-opacity">遮罩透明度:</label>
                <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.3">
            </div>
            <div class="setting-item">
                <label>新标签页打开书签</label>
                <label class="switch">
                    <input type="checkbox" id="open-new-tab">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <label>外观</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="theme" value="light"> 浅色
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="theme" value="dark"> 深色
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="theme" value="system"> 跟随系统
                    </label>
                </div>
            </div>

            <button id="save-settings">保存</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
