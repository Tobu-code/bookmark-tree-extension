<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background-layer"></div>
    
    <div class="container">
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Search bookmarks...">
        </div>
        <div id="bookmarks-tree" class="tree-view"></div>
    </div>

    <button id="settings-btn" title="Settings">⚙️</button>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2>Settings</h2>
            <div class="setting-item">
                <label for="bg-url">Background Image URL:</label>
                <input type="text" id="bg-url" placeholder="https://example.com/image.jpg">
            </div>
            <div class="setting-item">
                <label for="bg-upload">Or Upload Image:</label>
                <input type="file" id="bg-upload" accept="image/*">
            </div>
            <div class="setting-item">
                <label for="bg-opacity">Overlay Opacity:</label>
                <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.3">
            </div>
            <button id="save-settings">Save</button>
            <button id="clear-bg">Reset Background</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
